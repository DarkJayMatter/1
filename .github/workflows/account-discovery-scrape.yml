name: account-discovery-scrape
# Reads the command line from account-discovery/run.txt, runs the scraper,
# and commits any output back to the same branch under account-discovery/out/.
on:
  push:
    paths:
      - "account-discovery/run.txt"
      - "account-discovery/account_scrapers.py"
      - "account-discovery/jobsearch.py"
      - ".github/workflows/account-discovery-scrape.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 openpyxl "psycopg[binary]"
      - name: Run scraper
        working-directory: account-discovery
        env:
          CAREERJET_KEY: ${{ secrets.CAREERJET_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
        run: |
          mkdir -p logs
          # run.txt starting with "jobsearch" runs the job-board evidence script; anything else the scraper
          if [ "$(cut -d' ' -f1 run.txt)" = "jobsearch" ]; then
            python jobsearch.py $(cut -d' ' -f2- run.txt) 2>&1 | tee "logs/run-${{ github.run_id }}.log"
          else
            python account_scrapers.py $(cat run.txt) 2>&1 | tee "logs/run-${{ github.run_id }}.log"
          fi
      - name: Commit output
        if: always()
        run: |
          git config user.name "account-discovery-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f -A account-discovery
          git commit -m "account-discovery: scraper output" || echo "nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
